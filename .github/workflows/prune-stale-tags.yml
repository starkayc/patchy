name: Prune stale tags

on:
  workflow_dispatch:

permissions: {}

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete stale GHCR versions
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TARGETS: >-
            ["2026.11.16-e8eca32","2026.11.16-efe4d33","2026.11.16-6f1e7a4",
            "sha256-2b05547ca65fec61fab0403bd3089da63d3db83322a0109dcfcf829812d58097.sig"]
        run: |
          set -euo pipefail

          page=1
          while :; do
            response=$(curl -fsS \
              -H "Authorization: Bearer ${GHCR_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/patchy/versions?per_page=100&page=${page}")

            count=$(echo "$response" | jq 'length')
            ids=$(echo "$response" | jq -r --argjson targets "$TARGETS" '
              [ .[] | select((.metadata.container.tags // []) as $tags
                | $tags | any(. as $t | $targets | index($t))) | .id ] | unique | .[]')

            for id in $ids; do
              tags=$(echo "$response" | jq -r --argjson id "$id" '.[] | select(.id == $id) | (.metadata.container.tags // []) | join(",")')
              if curl -fsS -o /dev/null -X DELETE \
                -H "Authorization: Bearer ${GHCR_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/packages/container/patchy/versions/${id}"; then
                echo "GHCR: deleted version ${id} (${tags})"
              else
                echo "GHCR: failed to delete version ${id} (${tags})"
                exit 1
              fi
            done

            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
