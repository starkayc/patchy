name: "patchy CI"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"
    paths-ignore:
      - "*.md"
      - LICENCE
      - LICENSE
      - .git*
      - .github/**
      - screenshots/*
      - config/**
      - .vscode/**
      - patchy.service
      - docker-compose.yml
      - docs/**
  pull_request:
    branches:
      - "main"
      - "master"
    paths-ignore:
      - "*.md"
      - LICENCE
      - LICENSE
      - .git*
      - .github/**
      - screenshots/*
      - config/**
      - .vscode/**
      - patchy.service
      - docker-compose.yml
      - docs/**

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN cannot push until the package grants this repo Actions
      # write access, so publish with the PAT for now.
      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            starkayc/patchy
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix={{date 'YYYY.MM.DD'}}-,enable=${{ github.ref == format('refs/heads/{0}', 'master') || github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') || github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dist/docker/Dockerfile
          build-args: |
            RELEASE=1
            CURRENT_BRANCH=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign main image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "starkayc/patchy@${DIGEST}"
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Docker meta (rootless)
        id: meta-rootless
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: |
            starkayc/patchy
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix={{date 'YYYY.MM.DD'}}-,suffix=-rootless,enable=${{ github.ref == format('refs/heads/{0}', 'master') || github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest-rootless,enable=${{ github.ref == format('refs/heads/{0}', 'master') || github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build rootless image for smoke test
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dist/docker/Dockerfile.rootless
          build-args: |
            RELEASE=1
            CURRENT_BRANCH=${{ github.ref_name }}
          tags: patchy-rootless:test
          platforms: linux/amd64
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test rootless image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE=patchy-rootless:test
          docker run --rm --entrypoint /usr/bin/ffmpeg "$IMAGE" -version >/dev/null
          UPLOAD=/tmp/patchy-upload.txt
          printf 'hello patchy\n' > "$UPLOAD"
          rm -rf /tmp/patchy-smoke && mkdir -p /tmp/patchy-smoke
          sudo chown -R 65532:65532 /tmp/patchy-smoke
          docker run -d --name patchy-rootless -p 18080:8080 \
            -v /tmp/patchy-smoke:/data "$IMAGE"
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs patchy-rootless 2>&1 || true; fi; docker rm -f patchy-rootless >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/-/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs patchy-rootless; exit 1; fi
          curl -fsS -F "file=@${UPLOAD}" \
            http://127.0.0.1:18080/-/upload > /tmp/patchy-response.json
          grep -q '"link"' /tmp/patchy-response.json

      - name: Build and push rootless image
        id: build-rootless
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dist/docker/Dockerfile.rootless
          build-args: |
            RELEASE=1
            CURRENT_BRANCH=${{ github.ref_name }}
          tags: ${{ steps.meta-rootless.outputs.tags }}
          labels: ${{ steps.meta-rootless.outputs.labels }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign rootless image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-rootless.outputs.digest }}
        run: |
          cosign sign --yes "starkayc/patchy@${DIGEST}"
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
