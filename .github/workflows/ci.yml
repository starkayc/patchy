name: "patchy CI"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"
    paths-ignore:
      - "*.md"
      - LICENCE
      - LICENSE
      - .git*
      - screenshots/*
      - config/**
      - .vscode/**
      - patchy.service
      - docker-compose.yml
      - docs/**

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            starkayc/patchy
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix={{date 'YYYY.MM.DD'}}-,enable=${{ github.ref == format('refs/heads/{0}', 'master') || github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') || github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dist/docker/Dockerfile
          build-args: |
            RELEASE=1
            CURRENT_BRANCH=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "starkayc/patchy@${DIGEST}"
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
