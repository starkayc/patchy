name: Run Ameba Linter against Patchy source code

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"
    paths-ignore: &paths_ignore
      - "*.md"
      - LICENCE
      - .git*
      - screenshots/*
      - config/**
      - .vscode/**
      - patchy.service
      - docker-compose.yml
      - docs/**
  pull_request:
    branches:
      - "*"
    paths-ignore: *paths_ignore

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: https://github.com/crystal-ameba/github-action@v1
